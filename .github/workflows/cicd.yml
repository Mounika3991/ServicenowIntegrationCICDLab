name: ServiceNow connectivity test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    steps:
      # ...keep the "Resolve ServiceNow instance" step exactly as pasted...

      - name: Call u_app_portfolio
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -u "$SN_USERNAME:$SN_PASSWORD" \
            -H "Accept: application/json" \
            "https://$SN_INSTANCE.service-now.com/api/now/table/x_cd_grc_app_risk_assessment?sysparm_limit=1")
          echo "HTTP status: $code"
          cat out.json
          [ "$code" = "200" ]
