name: CICD Pipeline

on:
  push:
    branches: [lab2-start]   # match your actual branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve ServiceNow instance
        env:
          RAW: ${{ vars.SN_INSTANCE_DOMAIN }}
        run: |
          # ...the full resolve script exactly as in your paste...

      - name: Call x_cd_grc_app_risk_assessment
        env:
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -u "$SN_USERNAME:$SN_PASSWORD" \
            -H "Accept: application/json" \
            "https://$SN_INSTANCE.service-now.com/api/now/table/x_cd_grc_app_risk_assessment?sysparm_limit=1")
          echo "HTTP status: $code"
          cat out.json
          [ "$code" = "200" ]

      - name: Apply changes
        uses: ServiceNow/sncicd-apply-changes@2.0.0
        continue-on-error: true
        env:
          nowUsername: ${{ secrets.SN_USERNAME }}
          nowPassword: ${{ secrets.SN_PASSWORD }}
          nowSourceInstance: ${{ env.SN_INSTANCE }}
          appScope: x_cd_grc_app
