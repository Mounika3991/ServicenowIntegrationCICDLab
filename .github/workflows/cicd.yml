name: Pull risk assessment records

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      nowUsername: ${{ secrets.SN_USERNAME }}
      nowPassword: ${{ secrets.SN_PASSWORD }}
    steps:
      - name: Resolve ServiceNow instance
        env:
          RAW: ${{ vars.SN_INSTANCE_DOMAIN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::SN_INSTANCE_DOMAIN is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          INSTANCE=$(printf '%s' "$RAW" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' \
            | sed -e 's#^[a-z][a-z0-9+.-]*://##' -e 's#/.*$##' -e 's#\.service-now\.com$##')
          echo "Resolved instance: $INSTANCE"
          echo "SN_INSTANCE=$INSTANCE" >> "$GITHUB_ENV"

      - name: Check inputs are set
        run: |
          [ -n "$nowUsername" ] && echo "username: set" || { echo "username: EMPTY"; exit 1; }
          [ -n "$nowPassword" ] && echo "password: set" || { echo "password: EMPTY"; exit 1; }

      - name: Pull records
        run: |
          code=$(curl -s -D headers.txt -o out.json -w "%{http_code}" \
            -u "$nowUsername:$nowPassword" -H "Accept: application/json" \
            "https://$SN_INSTANCE.service-now.com/api/now/table/x_cd_grc_app_risk_assessment?sysparm_limit=50&sysparm_display_value=all")
          echo "HTTP status: $code"
          echo "Total rows visible to this user: $(grep -i '^x-total-count' headers.txt | tr -d '\r' || echo unknown)"
          jq . out.json
          [ "$code" = "200" ]

      - name: Show the logged-in API user
        run: |
          curl -s -u "$nowUsername:$nowPassword" -H "Accept: application/json" \
            "https://$SN_INSTANCE.service-now.com/api/now/table/sys_user?sysparm_query=user_name=$nowUsername&sysparm_fields=user_name,roles" \
            | jq .
